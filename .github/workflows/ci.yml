name: QGIS AI Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run unit, contract, and security test suite
        run: |
          pytest tests -q

      - name: Verify clean workspace after tests (no MagicMock side-effects)
        run: |
          test ! -d MagicMock

      - name: Build distribution ZIP package
        run: |
          python build.py
          ls -la qgis_agent_plugin_v*.zip
